[project]
name = "ocular-renderer"
version = "0.1.0"
description = "Deterministic subject-aware animation renderer for Ocular"
requires-python = ">=3.12,<3.14"
dependencies = [
  "astropy>=7.2.0",
  "biopython>=1.87",
  "fastapi>=0.116.0",
  "geopandas>=1.1.0",
  "manim>=0.21.0",
  "matplotlib>=3.10.0",
  "networkx>=3.4.0",
  "numpy>=2.2.0",
  "pydantic>=2.11.0",
  "rdkit>=2025.3.0",
  "scipy>=1.15.0",
  "shapely>=2.1.0",
  "simpy>=4.1.1",
  "sympy>=1.13.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
